<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <title>{{title}} (feed 4:5)</title>
    <link rel="stylesheet" href="kit:ad.css" />
    <style>
      .ad {
        {{vars}}
      }
    </style>
  </head>
  <body>
    <!-- Bold black, feed 4:5. Filled by `npm run ad:new -- bold-black <dir> ...`; see RULES.md 10. -->
    <main class="ad ad--portrait bb{{animate}}">
      <div class="safe bb-safe">
        <p class="bb-brand">Q THREE INTERIORS</p>
        <hr class="bb-rule" />
        <h1 class="bb-headline">{{headline}}</h1>
        <p class="bb-line">{{line}}</p>
        <div class="bb-button">
          <span>{{button}}</span>
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 12h16M14 6l6 6-6 6" />
          </svg>
        </div>
      </div>
    </main>
  </body>
</html>
