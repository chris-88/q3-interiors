<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <title>{{title}} (feed 4:5)</title>
    <link rel="stylesheet" href="kit:ad.css" />
    <style>
      .ad {
        {{vars}}
      }
    </style>
  </head>
  <body>
    <!-- Bold black, feed 4:5. Filled by `npm run ad:new -- bold-black <dir> ...`; see RULES.md 10. -->
    <main class="ad ad--portrait bb{{animate}}{{has_button}}">
      <div class="safe bb-safe">
        <img class="bb-logo" src="kit:wordmark-white.svg" alt="Q3 Interiors" />
        <h1 class="bb-headline">{{headline}}</h1>
        <p class="bb-line">{{line}}</p>
        {{button}}
      </div>
    </main>
  </body>
</html>
