<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="utf-8" />
    <title>Q3 Interiors ad: Stories and Reels 9:16</title>
    <link rel="stylesheet" href="kit:ad.css" />
    <style>
      .safe {
        justify-content: space-between;
      }
      .copy {
        display: flex;
        flex-direction: column;
        gap: 56px;
      }
    </style>
  </head>
  <body>
    <!--
      Type-only Stories/Reels ad, 1440 x 2560. Everything that matters sits in .safe: Instagram
      covers the top 14% and the bottom 35% with its own interface (Meta's guidance).
    -->
    <main class="ad ad--vertical">
      <div class="safe">
        <img class="ad-wordmark" src="kit:wordmark-black.svg" alt="Q3 Interiors" />
        <div class="copy">
          <h1 class="ad-headline">Headline in sentence case</h1>
          <p class="ad-line">One supporting line, only what the site already says.</p>
        </div>
        <hr class="ad-rule" />
      </div>
    </main>
  </body>
</html>
